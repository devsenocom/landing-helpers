name: Release helpers

# Cuts a new release whenever the helper sources change in main:
#  - rebuilds helper.js / helper-custom.js from projects.json
#  - commits the rebuilt files (jsDelivr serves repo content at a tag,
#    so the artifacts have to be in the tree the tag points at)
#  - computes the next tag (patch +1 from the latest semver tag)
#  - creates a GitHub Release and marks it as latest
#  - purges the latest version on jsDelivr

on:
  push:
    branches: [main]
    paths:
      - 'projects.json'
      - 'src/**'
      - 'build.js'
      - 'helper.js'
      - 'helper-custom.js'

# Needs permission to create tags, commits and releases
permissions:
  contents: write

# Never run two releases in parallel
concurrency:
  group: release-helpers
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all tags are needed to compute the version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build helpers from projects.json
        # Fails the whole run if projects.json is invalid, so a broken config
        # can never reach the CDN.
        run: node build.js

      - name: Commit rebuilt helpers
        id: build_commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- helper.js helper-custom.js; then
            echo "Built files already match the commit - nothing to push."
          else
            echo "Built files changed - committing."
            git add helper.js helper-custom.js
            git commit -m "build: regenerate helpers from projects.json"
            # A push authenticated with GITHUB_TOKEN does not re-trigger
            # workflows, so this cannot loop back into another release.
            git push origin HEAD:main
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute next version
        id: version
        run: |
          # Latest tag shaped X.Y.Z (ignore everything else, e.g. "release")
          latest="$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
          if [ -z "$latest" ]; then
            next="0.0.1"
          else
            IFS='.' read -r major minor patch <<< "$latest"
            next="${major}.${minor}.$((patch + 1))"
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "next=$next"     >> "$GITHUB_OUTPUT"
          echo "Latest tag: ${latest:-<none>} -> next: $next"

      - name: Create GitHub Release (marked as latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.next }}" \
            --target "${{ steps.build_commit.outputs.sha }}" \
            --title "${{ steps.version.outputs.next }}" \
            --latest \
            --generate-notes

      - name: Purge jsDelivr latest cache
        run: |
          for path in \
            "https://purge.jsdelivr.net/gh/devsenocom/landing-helpers@latest/helper.js" \
            "https://purge.jsdelivr.net/gh/devsenocom/landing-helpers/helper.js" \
            "https://purge.jsdelivr.net/gh/devsenocom/landing-helpers@latest/helper-custom.js" \
            "https://purge.jsdelivr.net/gh/devsenocom/landing-helpers/helper-custom.js"
          do
            echo "Purging: $path"
            code="$(curl -s -o /tmp/purge_resp.json -w '%{http_code}' "$path")"
            echo "HTTP $code"
            cat /tmp/purge_resp.json 2>/dev/null || true
            echo
          done
          # Purge is best-effort: don't fail the workflow if jsDelivr errors out
          echo "jsDelivr purge requested (best-effort)."
