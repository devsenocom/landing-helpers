<!DOCTYPE html>
<html lang="en">

<head>
    <script src="helper-custom.js"></script>
    <style>
        html, body {
            margin: 0;
            height: 100%;
        }

        #app {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #666;
            background: #fff;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #ddd;
            border-top-color: #888;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<!-- SET TAG HERE - ↓↓ -->
<!-- data-auto-redirect       — fires the custom event, then redirects by platform -->
<!-- data-redirect-delay="600" — optional wait (ms) so the screen paints; defaults to 0 -->

<body data-project="bv" data-auto-redirect data-redirect-delay="600">
    <!-- <body data-project="ac" data-auto-redirect> -->
    <!-- <body data-project="lr" data-auto-redirect> -->

    <!-- For a truly blank page, leave #app empty. -->
    <div id="app">
        <div class="spinner"></div>
        <p>Redirecting…</p>
    </div>
</body>

</html>
